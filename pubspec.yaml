name: parchi
description: Parchi - free 58mm / 80mm Bluetooth thermal printing. Share a PDF or image, preview on paper, print with no watermark.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^12.0.0
  pdfx: ^2.9.0
  print_bluetooth_thermal: ^1.1.4
  permission_handler: ^11.3.1
  receive_sharing_intent: 1.8.1
  qr_flutter: ^4.1.0
  barcode: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
